name: CD shoplaptopaz

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale Connection
        run: |
          ping -c 4 100.65.251.18

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.65.251.18
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -Eeuxo pipefail

            trap 'echo " ERROR: Command failed at line $LINENO"; exit 1' ERR

            echo "=================================================="
            echo "START DEPLOY"
            echo "=================================================="

            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Current directory:"
            pwd

            echo "=================================================="
            echo "GO TO PROJECT"
            echo "=================================================="

            cd /home/hieucuto0975/laptopshop

            echo "Project files:"
            ls -lah

            echo "=================================================="
            echo "DOCKER INFO"
            echo "=================================================="

            docker --version
            docker compose version

            echo "=================================================="
            echo "PULL NEW IMAGES"
            echo "=================================================="

            docker compose pull

            echo "=================================================="
            echo "START CONTAINERS"
            echo "=================================================="

            docker compose up -d --remove-orphans

            echo "Waiting 15 seconds for containers to start..."
            sleep 15

            echo "=================================================="
            echo "CONTAINER STATUS"
            echo "=================================================="

            docker compose ps
            docker ps -a

            echo "=================================================="
            echo "CONTAINER LOGS"
            echo "=================================================="

            docker compose logs --tail=200

            echo "=================================================="
            echo "REMOVE UNUSED IMAGES"
            echo "=================================================="

            docker image prune -af

            echo "=================================================="
            echo "DEPLOY SUCCESS"
            echo "=================================================="