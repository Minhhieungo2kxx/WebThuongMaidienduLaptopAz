name: ShopLaptop CI

on:
pull_request:
branches:
  - main

jobs:

test:

  ```
runs-on: ubuntu-latest

steps:

  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21
      cache: maven

  - name: Run Test & Build
    run: mvn clean verify
  ```
