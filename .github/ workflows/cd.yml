name: ShopLaptop CD

on:
push:
branches:
  - main

jobs:

deploy:

  ```
runs-on: ubuntu-latest

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21
      cache: maven

  - name: Build WAR
    run: mvn clean package -DskipTests

  - name: Login Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:${{ github.sha }} \
        -t ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:latest .

  - name: Push Docker Image
    run: |
      docker push ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:${{ github.sha }}
      docker push ${{ secrets.DOCKER_USERNAME }}/shoplaptop-backend:latest

  - name: Deploy to Ubuntu
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.SSH_HOST }}
      username: ${{ secrets.SSH_USER }}
      key: ${{ secrets.SSH_PRIVATE_KEY }}

      script: |
        cd /home/hieucuto0975/laptopshop

        docker compose pull

        docker compose up -d

        docker image prune -af
  ```
